services:
  - type: web
    name: flixtv-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: LOG_LEVEL
        value: info
      - key: API_SHARED_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CINESRC_ENABLED
        value: "false"
      - key: CINESRC_BASE_URL
        sync: false
      - key: CINESRC_API_KEY
        sync: false
